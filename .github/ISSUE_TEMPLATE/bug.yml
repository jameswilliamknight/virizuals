name: Bug report
description: Something isn't behaving as expected.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether you clicked, held, used a keyboard or changed tabs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 26, macOS, reduced motion enabled
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recording or console errors
      description: Please remove any personal information before uploading.
